name: fabrika

on:
  workflow_dispatch:
    inputs:
      gunluk_yeni:
        description: "Bugün başlatılacak en çok yeni tarif (en çok 10)"
        default: "10"
      tarif:
        description: "Yalnız bu tarifi başlat (boş: sıradaki)"
        default: ""
      yayim:
        description: "1: eşikten geçenleri yayımla, 0: yalnız özel yükle (deneme)"
        default: "1"
  push:
    branches: [main]
    paths: ["tetik/**"]     # dış rutin her gece buraya bir tetik dosyası iter (cron tek başına güvenilmedi)
  schedule:
    - cron: "30 15 * * *"   # yedek (18:30 TSİ): önce günün setleri kurulur, 20:30/23:25 TSİ penceresinde yüklenir

concurrency:
  group: fabrika
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONIOENCODING: utf-8
      CI: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      GUNLUK_YENI: ${{ github.event.inputs.gunluk_yeni || '10' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sistem paketleri
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: Geofabrik ay anahtarı
        id: ay
        run: echo "ay=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: OSM dökümü önbelleği
        id: osm
        uses: actions/cache@v4
        with:
          path: veri/turkey-latest.osm.pbf
          key: osm-turkiye-${{ steps.ay.outputs.ay }}

      - name: OSM dökümünü indir
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          mkdir -p veri
          curl -fL --retry 5 --retry-delay 10 -o veri/turkey-latest.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          ls -l veri/turkey-latest.osm.pbf

      - name: Git kimliği (yalnız durum dosyaları için)
        run: |
          git config user.name "set-fabrikasi-bot"
          git config user.email "set-fabrikasi-bot@users.noreply.github.com"

      - name: CORINE 2024 Türkiye kırpımı (bir kez; sunucu kapalıysa sessizce geçer)
        continue-on-error: true
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view etiket-v1 --json assets -q '.assets[].name' | grep -qx clc2024_tr.tif; then echo "CORINE zaten hazır"; exit 0; fi
          if ! curl -s -o /dev/null -m 30 https://sdi.eea.europa.eu/data/a65428d3-bd66-4b47-bcf9-6bfd6fa5df0c/; then echo "EEA sunucusu yanıt vermiyor; yarın"; exit 0; fi
          python araclar/etiket_hazirla.py clc clc_cikti && gh release upload etiket-v1 clc_cikti/clc2024_tr.tif clc_cikti/clc_karolar.json --clobber
          ls clc_cikti/_* 2>/dev/null && for f in clc_cikti/_*; do echo "== $f"; head -c 3000 "$f"; done || true

      - name: Fabrikayı çalıştır
        env:
          EVREN_PLATFORM_KEY: ${{ secrets.EVREN_PLATFORM_KEY }}
          YAYIM: ${{ github.event.inputs.yayim || '1' }}
          TARIF: ${{ github.event.inputs.tarif }}
        run: |
          if [ -n "$TARIF" ]; then python -P fabrika.py --tarif "$TARIF"; else python -P fabrika.py; fi

      - name: Durumu gönder (yedek; hata olsa da)
        if: always()
        run: python -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from cekirdek import durum; durum.gonder(Path('.'))"
