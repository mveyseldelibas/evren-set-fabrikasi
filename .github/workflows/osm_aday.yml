name: osm-aday-sayimi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  say:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "osmium>=4.0"
      - name: Geofabrik ay anahtarı
        id: ay
        run: echo "ay=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: OSM dökümü önbelleği
        id: osm
        uses: actions/cache/restore@v4
        with:
          path: veri/turkey-latest.osm.pbf
          key: osm-turkiye-${{ steps.ay.outputs.ay }}
      - name: OSM dökümünü indir
        if: steps.osm.outputs.cache-hit != 'true'
        run: mkdir -p veri && curl -fL --retry 5 --retry-delay 10 -o veri/turkey-latest.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
      - run: python araclar/osm_aday_say.py veri/turkey-latest.osm.pbf - aday_sayim.json
      - uses: actions/upload-artifact@v4
        with:
          name: aday-sayim
          path: aday_sayim.json
