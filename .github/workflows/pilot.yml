name: pilot
# Bir tarifin küçük pilotunu ağda hiçbir şey yazmadan kurar; örnek görüntü ve etiketleri yapıt olarak saklar.
on:
  workflow_dispatch:
    inputs:
      tarif:
        description: "Tarif kimliği"
        required: true
      pilot:
        description: "Pencere sayısı"
        default: "12"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      KURU_TEMIZLE: "0"
      TMPDIR: ${{ github.workspace }}/pilot_cikti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -r requirements.txt
      - run: mkdir -p pilot_cikti
      - name: Pilot
        run: python -P fabrika.py --kuru --tarif "${{ github.event.inputs.tarif }}" --pilot "${{ github.event.inputs.pilot }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ github.event.inputs.tarif }}
          path: pilot_cikti
          retention-days: 7
